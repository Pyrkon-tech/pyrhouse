name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # Browser smoke: catches runtime crashes a green build hides
      # (e.g. the MUI-icon interop crash that broke prod while build passed)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test built app
        run: |
          npm run preview &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/login > /dev/null && break
            sleep 1
          done
          BASE_URL=http://localhost:4173 npm run smoke
          STATUS=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $STATUS
