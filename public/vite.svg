<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pyrhouse / Pyrkon IT Wizards icon</title>
  <desc id="desc">Dark navy rounded-square icon with an orange P wearing a wizard hat and a muted teal partial gear.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1028"/>
      <stop offset="1" stop-color="#061827"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9b12"/>
      <stop offset="1" stop-color="#f47a00"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f95a3"/>
      <stop offset="1" stop-color="#335f72"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- simplified technical gear arc -->
  <g fill="url(#teal)" opacity="0.92" filter="url(#softShadow)">
    <path fill-rule="evenodd" d="M130 219c6-51 45-92 95-103l9 42c-37 8-65 39-70 77-6 49 26 95 73 106l-10 42c-68-16-111-82-97-164Zm111 172 4-43c22 1 44-4 63-16l23 36c-27 17-58 25-90 23Z"/>
    <rect x="167" y="121" width="36" height="42" rx="5" transform="rotate(-43 185 142)"/>
    <rect x="93" y="223" width="44" height="34" rx="5"/>
    <rect x="130" y="320" width="38" height="42" rx="5" transform="rotate(-36 149 341)"/>
    <rect x="210" y="354" width="40" height="36" rx="5" transform="rotate(9 230 372)"/>
    <rect x="310" y="333" width="42" height="36" rx="5" transform="rotate(-38 331 351)"/>
  </g>

  <!-- main P letter, drawn as vector shapes -->
  <g fill="url(#orange)" filter="url(#softShadow)">
    <path d="M204 156h115c69 0 111 39 111 95s-42 95-111 95h-64v87c-17-2-33-9-45-21-12-13-18-29-18-47V168c0-7 5-12 12-12Zm51 55v82h60c31 0 50-15 50-41s-19-41-50-41h-60Z"/>
  </g>

  <!-- wizard hat resting on the P -->
  <g fill="url(#orange)" filter="url(#softShadow)">
    <path d="M146 158c31-38 49-72 73-103 5-7 14-7 20-1 31 29 56 62 76 96-44-2-103 2-169 8Z"/>
    <path d="M130 178c79-24 146-36 216-33 8 0 11 10 5 15-45 37-129 61-221 65-10 0-15-11-8-18l8-29Z"/>
    <path d="M149 164c56-14 106-21 159-20l-4 19c-49 0-97 8-145 21l-10-20Z" fill="#071426" opacity="0.95"/>
  </g>

  <!-- tiny magic spark -->
  <path d="M143 129c8 18 13 23 31 31-18 8-23 13-31 31-8-18-13-23-31-31 18-8 23-13 31-31Z" fill="#ff9b12"/>
</svg>
